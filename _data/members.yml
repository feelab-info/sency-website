  description: "Mariana Lameiro is currently pursuing a B.Sc. degree in General Studies at the University of Lisbon, with minors in Biology, Mathematics, and Psychology, and complementary coursework in Programming. She has been a Research Intern at LASIGE – Large-Scale Informatics Systems Laboratory, University of Lisbon, where she applied computational methodologies and Large Language Models to accelerometry data for predictive modelling of Parkinson's disease progression. In parallel, she has been a Research Trainee at IBEB – Institute of Biophysics and Biomedical Engineering, conducting literature reviews on evoked potentials and developing technical proficiency in EEG data processing and neural signal analysis"