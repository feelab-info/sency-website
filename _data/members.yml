  description: Paulo Bala is an Auxiliary Researcher at the Interactive Technologies Institute (ITI/LARSyS) and ARDITI (Regional Agency for the Development of Research, Technology and Innovation) since 2025. He holds a Ph.D. in Digital Media from FCT-UNL, Lisbon (2022), where he specialized in 360° video and eXtended Reality (XR). He also holds a Dual Master's in Entertainment Technology from Carnegie Mellon University and the University of Madeira, and BSc/MSc degrees in Informatics Engineering from the University of Madeira. His research focuses on Human-Computer Interaction and XR, with a strong emphasis on cultural heritage, health and sustainability and his research work has been published in top peer-reviewed venues in Human-Computer Interaction (such as CHI, CSCSW, DIS, and ISMAR).

