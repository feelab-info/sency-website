  description: "Marcelo received the B.Sc. and M.Sc. degrees in electrical and computer engineering from the Instituto Superior Técnico, Universidade de Lisboa, in 2021 and 2023, respectively. He is currently pursuing a Ph.D. degree in engineering and technology with an emphasis on data science, machine learning, electric vehicles, and renewable energy. He has been a Researcher at the INESC-ID – Instituto de Engenharia de Sistemas e Computadores Investigação e Desenvolvimento em Lisboa, since 2023, participating in multiple horizon Europe-funded projects. He has received four awards and/or honours for his academic journey."

- name: Nicollas Nogueira
  degrees: BSc
  image: team_Nicollas-Nogueira.jpeg
  country: Portugal
  linkedin: "nicollas-nogueira-591232283"
  description: "Nicollas Nogueira is a student of Electrical Engineering and Computer Science at the Instituto Superior Técnico, University of Lisbon. Previously, he worked on a project applying large language models (LLMs) in the context of energy communities for ITI/LARSyS. At SENCY, his work focuses on updating and integrating the sensor infrastructure for energy and water monitoring, including communication and data storage, as well as supporting the assessment of the viability of industrial kitchens within energy communities."

